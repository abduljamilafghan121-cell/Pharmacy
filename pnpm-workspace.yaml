# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  # Pinned to the 19.1.x line to match the exact `react`/`react-dom` version
  # below (Expo requires 19.1.0) — @types/react 19.2 tightened ref-callback
  # typing in ways that break react-day-picker / Radix Slot against 19.1.
  '@types/react': ~19.1.0
  '@types/react-dom': ~19.1.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
  # orval (lib/api-spec devDependency, used only for OpenAPI codegen) pulls in
  # @scalar/openapi-parser, which at the time of writing requests an exact
  # @scalar/openapi-types@0.9.5 that no longer exists on the npm registry —
  # this fails the entire workspace install with ERR_PNPM_NO_MATCHING_VERSION.
  # Forcing a range instead of pinning one exact patch lets pnpm resolve to
  # whatever 0.9.x actually exists at install time.
  "@scalar/openapi-types": "^0.9.0"
  # react-native@0.81.5 (via @react-native/community-cli-plugin -> metro)
  # requests an exact metro@0.83.8, which in turn requests exact 0.83.8
  # siblings (metro-file-map, metro-cache, metro-config, etc.) — none of
  # which were ever published. The 0.83-stable line for every package in
  # the metro family stops at 0.83.7. Overriding metro-cache alone only
  # fixes one sibling at a time; pinning the whole family stops pnpm from
  # ever trying to resolve the nonexistent 0.83.8. Scoped to 0.83.x (not
  # the unrelated 0.84+/0.87.0 "latest") since react-native 0.81.5 expects
  # that specific stable line.
  metro: "^0.83.0"
  "metro-babel-transformer": "^0.83.0"
  "metro-cache": "^0.83.0"
  "metro-cache-key": "^0.83.0"
  "metro-config": "^0.83.0"
  "metro-core": "^0.83.0"
  "metro-file-map": "^0.83.0"
  "metro-resolver": "^0.83.0"
  "metro-runtime": "^0.83.0"
  "metro-source-map": "^0.83.0"
  "metro-symbolicate": "^0.83.0"
  "metro-transform-plugins": "^0.83.0"
  "metro-transform-worker": "^0.83.0"

allowBuilds:
  electron: true
  esbuild: true
