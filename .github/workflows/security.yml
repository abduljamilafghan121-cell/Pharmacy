name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Gate on production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Report full dependency audit (informational)
        run: pnpm audit || true

  build:
    name: Build and typecheck (api + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build web (matches vercel.json buildCommand)
        run: BASE_PATH=/ PORT=3000 NODE_ENV=production pnpm --filter @workspace/web run build

  mobile:
    name: Build static Expo export (ios + android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile
        run: pnpm --filter @workspace/mobile run typecheck
      - name: Build static Expo export
        env:
          EXPO_PUBLIC_DOMAIN: pharmacy-api-server-beige.vercel.app
        run: pnpm --filter @workspace/mobile run build
      - name: Verify bundles and manifests produced
        run: |
          BUN_IOS=$(find artifacts/mobile/static-build -path '*/_expo/static/js/ios/bundle.js' | head -1)
          BUN_AND=$(find artifacts/mobile/static-build -path '*/_expo/static/js/android/bundle.js' | head -1)
          test -n "$BUN_IOS" && test -s "$BUN_IOS" && echo "PASS: ios bundle ($(wc -c < "$BUN_IOS") bytes)"
          test -n "$BUN_AND" && test -s "$BUN_AND" && echo "PASS: android bundle ($(wc -c < "$BUN_AND") bytes)"
          test -s artifacts/mobile/static-build/ios/manifest.json && echo "PASS: ios manifest"
          test -s artifacts/mobile/static-build/android/manifest.json && echo "PASS: android manifest"

  dast:
    name: OWASP ZAP scan against live API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmacore
          POSTGRES_PASSWORD: pharmacore
          POSTGRES_DB: pharmacore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Start API, probe behavior, run ZAP
        env:
          PORT: 3000
          JWT_SECRET: ci-only-secret-not-for-production
          DATABASE_URL: postgres://pharmacore:pharmacore@localhost:5432/pharmacore
          NODE_ENV: production
          LOG_LEVEL: warn
        run: |
          node ./artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          API_PID=$!
          cleanup() { kill "$API_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/healthz
          echo "API healthy"

          echo "== no Origin (expect 200) =="
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/healthz
          echo "== null Origin, desktop file:// (expect 200) =="
          curl -s -o /dev/null -w "%{http_code}\n" -H "Origin: null" http://localhost:3000/api/healthz
          echo "== disallowed Origin (expect 403) =="
          curl -s -o /dev/null -w "%{http_code}\n" -H "Origin: https://evil.example.com" http://localhost:3000/api/healthz
          echo "== unauthenticated protected route (expect 401) =="
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/medicines
          echo "== malformed JSON login (expect 400) =="
          curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Content-Type: application/json" -d "{bad json" http://localhost:3000/api/auth/login

          echo "== cookie auth flow (NODE_ENV=production -> Secure cookie) =="
          REG=$(curl -s -X POST -H "Content-Type: application/json" \
            -d '{"name":"CI Probe","email":"ci-probe@example.com","password":"ProbePass123!"}' \
            -D /tmp/register.headers -c /tmp/cookies.jar -w "\n%{http_code}" \
            http://localhost:3000/api/auth/register)
          echo "register status: $(echo "$REG" | tail -n1)"
          echo "SET-COOKIE (register): $(grep -i '^set-cookie:' /tmp/register.headers)"
          grep -qi '^set-cookie:.*pharma_token=.*httponly' /tmp/register.headers && echo "PASS: HttpOnly"
          grep -qi '^set-cookie:.*samesite=lax' /tmp/register.headers && echo "PASS: SameSite=Lax"
          grep -qi '^set-cookie:.*path=/api' /tmp/register.headers && echo "PASS: Path=/api"
          grep -qi '^set-cookie:.*secure' /tmp/register.headers && echo "PASS: Secure"
          echo "== second public register (expect 403) =="
          curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Content-Type: application/json" \
            -d '{"name":"CI Probe 2","email":"ci-probe2@example.com","password":"ProbePass123!"}' \
            http://localhost:3000/api/auth/register
          echo "== me via cookie (expect 200) =="
          curl -s -b /tmp/cookies.jar -o /tmp/me.json -w "me(cookie): %{http_code}\n" http://localhost:3000/api/auth/me
          grep -q '"ci-probe@example.com"' /tmp/me.json && echo "PASS: cookie-authed /auth/me"
          echo "== me via Authorization header (expect 200) =="
          TOKEN=$(echo "$REG" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          curl -s -H "Authorization: Bearer $TOKEN" -o /tmp/me2.json -w "me(header): %{http_code}\n" http://localhost:3000/api/auth/me
          grep -q '"ci-probe@example.com"' /tmp/me2.json && echo "PASS: header-authed /auth/me"
          echo "== logout via cookie (expect 204 + cleared cookie) =="
          curl -s -b /tmp/cookies.jar -D /tmp/logout.headers -o /dev/null -w "logout: %{http_code}\n" -X POST http://localhost:3000/api/auth/logout
          echo "CLEAR COOKIE: $(grep -i '^set-cookie:' /tmp/logout.headers)"
          grep -qi '^set-cookie:.*pharma_token=;' /tmp/logout.headers && echo "PASS: cookie cleared"
          echo "== protected route with stale cookie after logout (expect 401) =="
          curl -s -H "Cookie: pharma_token=stale" -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/medicines

          echo "== ZAP quick scan (unauthenticated) =="
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/zap-report:/zap/reports" \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap.sh -cmd \
            -quickurl http://localhost:3000/api/healthz \
            -quickout /zap/reports/report.html
          test -f zap-report/report.html && echo "ZAP report generated"
          kill "$API_PID" 2>/dev/null || true
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/report.html
          if-no-files-found: ignore